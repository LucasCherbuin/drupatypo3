version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: db_cms
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cmsdb
      MYSQL_USER: cmsuser
      MYSQL_PASSWORD: cmspass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  drupal:
    build: ./drupal
    container_name: drupal_cms
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - ./drupal/html:/var/www/html

  typo3:
    build: ./typo3
    container_name: typo3_cms
    ports:
      - "8081:80"
    depends_on:
      - db
    volumes:
      - ./typo3/html:/var/www/html

volumes:
  db_data: